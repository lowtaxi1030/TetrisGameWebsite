<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/common.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
    <title>Tetris Game</title>
  </head>

  <body>
    <header>
      <h1 class="title">俄羅斯方塊</h1>
      <p class="text2">TETRIS GAME</p>
      <main>
        <nav id="main-menu">
          <button class="big-button" id="start-button">開始遊戲</button>
          <button class="big-button" id="settings-button">設定</button>
        </nav>
        <section id="highest-scores">
          <h2 id="score-list-title">最高分紀錄</h2>
          <div id="score-list">
            <!-- 由 JavaScript 動態填入紀錄 -->
          </div>
        </section>
      </main>
    </header>

    <!-- 載入 js -->
    <script
      src="{{ url_for('static', filename='js/index.js') }}"
      type="module"
    ></script>
  </body>
</html>
